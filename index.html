<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lingua Living</title><style>
:root{--p:#5b56d6;--ink:#25243a;--muted:#77758b;--bg:#f7f4ec;--line:#e7e1d5;--paper:#fffefa;--green:#daf3e1;--red:#cf5260}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans JP",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1100px;margin:auto;padding:22px;min-height:100vh}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:25px;font-weight:950;letter-spacing:-1px}.brand span{color:var(--p)}.actions,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.btn{padding:10px 14px;border-radius:11px;background:var(--p);color:#fff;font-weight:800;box-shadow:0 3px #403aa3}.btn.alt{background:#fff;color:var(--p);border:1px solid #dcd6fb;box-shadow:none}.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:19px}.panel{padding:25px}.layout{display:grid;grid-template-columns:278px 1fr;gap:20px}.side{padding:15px;height:max-content}.side button{display:block;width:100%;text-align:left;background:transparent;padding:10px;border-radius:9px;color:var(--ink)}.side button.active{background:#efedff;color:var(--p);font-weight:800}.chapter{font-weight:900;font-size:13px;padding:15px 9px 5px}.step{font-size:14px;border-left:3px solid transparent!important}.step.active{border-left-color:var(--p)!important}.progress{background:var(--green);border-radius:13px;padding:13px;margin-bottom:14px}.bar{height:8px;border-radius:99px;background:#e9e6df;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--p);border-radius:99px}.muted,small{color:var(--muted)}h1{margin:6px 0 8px;font-size:29px}.crumb{color:var(--muted);font-size:14px;font-weight:700}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:20px 0}.tab{padding:10px 13px;background:none;font-weight:800;color:var(--muted);border-bottom:3px solid transparent}.tab.active{color:var(--p);border-color:var(--p)}.item{padding:14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.item strong{font-size:18px}.tag{font-size:12px;background:#fff0d8;color:#91590e;padding:4px 7px;border-radius:7px;font-weight:800}.grammar{background:#f8f7ff;border:1px solid #ddd9ff;border-radius:14px;padding:17px;line-height:1.7}.empty{padding:28px;text-align:center;background:var(--green);border-radius:14px}.modal{display:none;position:fixed;inset:0;background:#25243a99;z-index:3;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.dialog{background:var(--paper);width:min(600px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:23px}.dialog h2{margin-top:0}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff}.field textarea{min-height:95px}.learn{max-width:640px;margin:25px auto;text-align:center}.question{padding:26px;margin-top:20px}.prompt{font-size:22px;font-weight:900;margin-bottom:22px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{border:2px solid var(--line);background:#fff;padding:15px;border-radius:11px;font-weight:800}.choice:hover{border-color:var(--p)}.answer{width:100%;padding:12px;text-align:center;font-size:21px;border:2px solid var(--line);border-radius:10px}.keys{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:15px}.key{padding:9px 12px;border-radius:8px;background:#efede8;border:1px solid #ddd7cc;font-weight:800}.feedback{min-height:25px;font-weight:800;margin:10px}.ok{color:#16834a}.bad{color:var(--red)}.hidden{display:none!important}@media(max-width:760px){.app{padding:14px}.layout{grid-template-columns:1fr}.side{display:none}.panel{padding:18px}.actions .alt{padding:9px}.choices{grid-template-columns:1fr}h1{font-size:24px}}
</style></head><body>
<div class="app" id="home"><header class="top"><div class="brand">Lingua <span>Living</span></div><div class="actions"><button class="btn alt" id="import">共有データを読む</button><button class="btn" id="create">＋ コースをつくる</button></div></header><main class="panel"><div class="crumb">あなたの学習スペース</div><h1>今日は何を学びますか？</h1><p class="muted">コースを自作して、何度でも学び直せます。</p><div id="courses"></div></main></div>
<div class="app hidden" id="course"><header class="top"><div class="brand">Lingua <span>Living</span></div><div class="actions"><button class="btn alt" id="share">共有する</button><button class="btn alt" id="homeBack">ホーム</button><button class="btn" id="addCard">＋ カード</button></div></header><div class="layout"><aside class="card side"><div class="progress"><b id="pct">0%</b><div class="bar"><i id="pbar"></i></div><small id="ptext"></small></div><div id="tree"></div><button id="addStep">＋ ステップを追加</button><button id="addChapter">＋ チャプターを追加</button></aside><main class="panel"><div class="crumb" id="crumb"></div><div class="row" style="justify-content:space-between"><div><h1 id="stepName"></h1><small id="review"></small></div><button class="btn" id="learn">学習・復習する</button></div><div class="tabs"><button class="tab active" data=tokens>カード</button><button class="tab" data=grammar>文法</button></div><section id="tokens"><div id="cards"></div><div class="row"><button class="btn alt" id="renameStep">ステップ名を変更</button><button class="btn alt" id="renameChapter">チャプター名を変更</button></div></section><section id="grammar" class="hidden"><div class="grammar"><h3 id="gtitle"></h3><p id="gbody"></p><div id="gexample"></div></div><p><button class="btn alt" id="editGrammar">文法ポイントを編集</button></p></section></main></div></div>
<div class="app hidden" id="study"><header class="top"><div class="brand">Lingua <span>Living</span></div><button class="btn alt" id="studyBack">コースに戻る</button></header><main class="learn"><small id="qtype"></small><h1 id="studyTitle"></h1><div class="bar"><i id="qbar"></i></div><div class="card question"><div class="prompt" id="prompt"></div><div id="answerBox"></div><div class="feedback" id="feedback"></div><button class="btn hidden" id="next">次へ</button></div></main></div><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div>
<script>
const $=s=>document.querySelector(s),clone=x=>JSON.parse(JSON.stringify(x));let state=JSON.parse(localStorage.getItem('lingua-living-v1')||'{"courses":[]}'),active=null,quiz=[],qi=0;
const blank=(name,flag={})=>({id:Date.now(),name,emoji:flag.emoji||'🌐',isSample:!!flag.sample,isPublic:!!flag.public,chapters:[{name:'チャプター 1',steps:[{name:'ステップ 1',cards:[],grammar:{title:'文法ポイント',body:'ここに文法の説明を書きます。',example:'例文 ＝ 意味'},done:false}]}],active:{c:0,s:0}});
function save(){localStorage.setItem('lingua-living-v1',JSON.stringify(state))}function esc(v){return String(v||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function page(x){['home','course','study'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==x))}function step(){return active.chapters[active.active.c].steps[active.active.s]}
function modal(html){$('#dialog').innerHTML=html;$('#modal').classList.add('show')}function close(){ $('#modal').classList.remove('show')}
function home(){page('home');let root=$('#courses');root.innerHTML=state.courses.length?'':'<div class="empty"><b>まだコースがありません</b><p class="muted">「＋ コースをつくる」から始めましょう。</p></div>';state.courses.forEach((c,i)=>{let ss=c.chapters.flatMap(x=>x.steps),done=ss.filter(x=>x.done).length,p=ss.length?Math.round(done/ss.length*100):0;root.innerHTML+=`<div class="card item"><div><strong>${esc(c.emoji)} ${esc(c.name)}</strong> ${c.isSample?'<span class="tag">サンプル</span>':''} ${c.isPublic?'<span class="tag">公開用</span>':''}<small>${done} / ${ss.length} ステップ完了 ・ 進捗 ${p}%</small><div class="bar" style="width:200px"><i style="width:${p}%"></i></div></div><div class="actions"><button class="btn" onclick="openCourse(${i})">学ぶ・編集</button><button class="btn alt" onclick="removeCourse(${i})">削除</button></div></div>`})}
window.openCourse=i=>{active=state.courses[i];renderCourse();page('course')};window.removeCourse=i=>{modal(`<h2>コースを削除しますか？</h2><p><b>${esc(state.courses[i].name)}</b> と学習記録を削除します。この操作は元に戻せません。</p><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">キャンセル</button><button class="btn" id="yesDelete">削除する</button></div>`);$('#yesDelete').onclick=()=>{state.courses.splice(i,1);save();close();home()}}
function renderCourse(){let st=step(),all=active.chapters.flatMap(x=>x.steps),done=all.filter(x=>x.done).length,p=all.length?Math.round(done/all.length*100):0;$('#pct').textContent=p+'%';$('#pbar').style.width=p+'%';$('#ptext').textContent=done+' / '+all.length+' ステップ完了';$('#crumb').textContent=active.name+' / '+active.chapters[active.active.c].name;$('#stepName').textContent=st.name;$('#review').textContent=st.done?'✓ 完了済みです。いつでも復習できます。':'';$('#cards').innerHTML=st.cards.length?st.cards.map((x,i)=>`<div class="card item"><div><strong>${esc(x.term)}</strong><small>${esc(x.meaning)} ${x.reading?'・ '+esc(x.reading):''}</small></div><button class="btn alt" onclick="editCard(${i})">編集</button></div>`).join(''):'<div class="empty">カードを追加して、このステップを作りましょう。</div>';$('#gtitle').textContent=st.grammar.title;$('#gbody').textContent=st.grammar.body;$('#gexample').textContent=st.grammar.example;$('#tree').innerHTML=active.chapters.map((ch,ci)=>{let h=`<div class="chapter">${esc(ch.name)}</div>`;h+=ch.steps.map((x,si)=>`<button class="step ${ci===active.active.c&&si===active.active.s?'active':''}" onclick="chooseStep(${ci},${si})">${x.done?'✓ ':'○ '}${esc(x.name)}${x.done?'（復習）':''}</button>`).join('');return h}).join('')}
window.chooseStep=(c,s)=>{active.active={c,s};save();renderCourse()};
function cardForm(i){let st=step(),x=i===undefined?{term:'',meaning:'',reading:''}:st.cards[i];modal(`<h2>${i===undefined?'カードを追加':'カードを編集'}</h2><div class="field"><label>学ぶ言葉</label><input id="term" value="${esc(x.term)}"></div><div class="field"><label>意味</label><input id="meaning" value="${esc(x.meaning)}"></div><div class="field"><label>読み方（任意）</label><input id="reading" value="${esc(x.reading)}"></div><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">キャンセル</button><button class="btn" id="saveCard">保存</button></div>`);$('#saveCard').onclick=()=>{let n={term:$('#term').value.trim(),meaning:$('#meaning').value.trim(),reading:$('#reading').value.trim()};if(!n.term||!n.meaning)return alert('学ぶ言葉と意味を入力してください。');i===undefined?st.cards.push(n):st.cards[i]=n;save();close();renderCourse()}}
window.editCard=cardForm;
function rename(kind){let ch=active.chapters[active.active.c],st=step(),value=kind==='step'?st.name:ch.name;modal(`<h2>${kind==='step'?'ステップ':'チャプター'}名を変更</h2><div class="field"><input id="rename" value="${esc(value)}"></div><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">キャンセル</button><button class="btn" id="saveRename">保存</button></div>`);$('#saveRename').onclick=()=>{let v=$('#rename').value.trim();if(!v)return alert('名前を入力してください。');kind==='step'?st.name=v:ch.name=v;save();close();renderCourse()}}
function grammarForm(){let g=step().grammar;modal(`<h2>文法ポイントを編集</h2><div class="field"><label>タイトル</label><input id="gt" value="${esc(g.title)}"></div><div class="field"><label>説明</label><textarea id="gb">${esc(g.body)}</textarea></div><div class="field"><label>例文</label><input id="ge" value="${esc(g.example)}"></div><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">キャンセル</button><button class="btn" id="saveGrammar">保存</button></div>`);$('#saveGrammar').onclick=()=>{step().grammar={title:$('#gt').value,body:$('#gb').value,example:$('#ge').value};save();close();renderCourse()}}
function start(){let st=step();if(!st.cards.length)return alert('まずカードを追加してください。');quiz=st.cards.flatMap((x,i)=>{let other=st.cards.filter((_,j)=>i!==j).map(y=>y.meaning).sort(()=>Math.random()-.5).slice(0,3);return[{type:'choice',prompt:'「'+x.term+'」の意味を選んでください。',answer:x.meaning,choices:[x.meaning,...other].sort(()=>Math.random()-.5)},{type:'input',prompt:'「'+x.meaning+'」を入力してください。',answer:x.term,keys:[...new Set(x.term.replace(/\s/g,'').split(''))]}]});qi=0;page('study');showQ()}
function showQ(){let q=quiz[qi];$('#studyTitle').textContent=step().name;$('#qtype').textContent=q.type==='choice'?'意味を選ぶ':'オンスクリーンキーボードで入力';$('#qbar').style.width=(qi/quiz.length*100)+'%';$('#prompt').textContent=q.prompt;$('#feedback').textContent='';$('#feedback').className='feedback';$('#next').classList.add('hidden');let box=$('#answerBox');if(q.type==='choice'){box.innerHTML='<div class="choices">'+q.choices.map(x=>`<button class="choice">${esc(x)}</button>`).join('')+'</div>';box.querySelectorAll('button').forEach(b=>b.onclick=()=>judge(b.textContent===q.answer,q.answer))}else{box.innerHTML=`<input class="answer" id="typed" readonly><div class="keys">${q.keys.map(k=>`<button class="key">${esc(k)}</button>`).join('')}<button class="key" id="back">⌫</button></div><button class="btn" id="check">答え合わせ</button>`;let input=$('#typed');box.querySelectorAll('.key').forEach(b=>b.onclick=()=>input.value=b.id==='back'?input.value.slice(0,-1):input.value+b.textContent);$('#check').onclick=()=>judge(input.value===q.answer,q.answer)}}
function judge(ok,answer){$('#feedback').textContent=ok?'正解！':'正解は「'+answer+'」です。';$('#feedback').classList.add(ok?'ok':'bad');$('#answerBox').querySelectorAll('button,input').forEach(x=>x.disabled=true);$('#next').classList.remove('hidden')}
$('#next').onclick=()=>{qi++;if(qi===quiz.length){step().done=true;save();$('#prompt').textContent='ステップ完了！';$('#answerBox').innerHTML='<p>いつでも復習できます。</p>';$('#next').classList.add('hidden');$('#qbar').style.width='100%'}else showQ()};
$('#create').onclick=()=>modal(`<h2>コースをつくる</h2><div class="field"><label>コース名</label><input id="cn" placeholder="例：スペイン旅行会話"></div><div class="field"><label>言語・絵文字</label><input id="ce" value="🌐"></div><div class="field"><label><input type="checkbox" id="cs"> サンプルコースにする</label><small>ホームですぐ学べるコースとして目印を付けます。</small></div><div class="field"><label><input type="checkbox" id="cp"> GitHub公開用コースにする</label><small>公開データとして出力できます。</small></div><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">キャンセル</button><button class="btn" id="make">作成する</button></div>`),$('#modal').onclick=e=>{if(e.target===$('#modal'))close()};
document.addEventListener('click',e=>{if(e.target.id==='make'){active=blank($('#cn').value.trim()||'新しいコース',{emoji:$('#ce').value.trim()||'🌐',sample:$('#cs').checked,public:$('#cp').checked});state.courses.push(active);save();close();renderCourse();page('course')}});
$('#import').onclick=()=>modal(`<h2>共有コースを追加</h2><p>受け取った共有データを貼り付けてください。</p><div class="field"><textarea id="data"></textarea></div><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">キャンセル</button><button class="btn" id="read">追加する</button></div>`),document.addEventListener('click',e=>{if(e.target.id==='read'){try{let x=JSON.parse($('#data').value);if(!x.name||!Array.isArray(x.chapters))throw 0;state.courses.push(x);save();close();home()}catch{alert('共有データの形式が正しくありません。')}}});
$('#share').onclick=()=>{let text=JSON.stringify(active);modal(`<h2>コースを共有</h2><p>データをコピーして相手に送ってください。GitHubで公開する場合は、これを <code>courses/</code> 内のJSONファイルとして保存します。</p><div class="field"><textarea id="shareData" readonly>${esc(text)}</textarea></div><div class="actions" style="justify-content:end"><button class="btn alt" onclick="close()">閉じる</button><button class="btn" id="copy">コピー</button></div>`);$('#copy').onclick=()=>{$('#shareData').select();navigator.clipboard?.writeText($('#shareData').value);document.execCommand('copy');alert('共有データをコピーしました。')}};
$('#homeBack').onclick=home;$('#studyBack').onclick=()=>{page('course');renderCourse()};$('#addCard').onclick=()=>cardForm();$('#learn').onclick=start;$('#renameStep').onclick=()=>rename('step');$('#renameChapter').onclick=()=>rename('chapter');$('#editGrammar').onclick=grammarForm;$('#addStep').onclick=()=>{let ch=active.chapters[active.active.c];ch.steps.push(clone(blank('').chapters[0].steps[0]));active.active.s=ch.steps.length-1;save();renderCourse()};$('#addChapter').onclick=()=>{active.chapters.push({name:'新しいチャプター',steps:[clone(blank('').chapters[0].steps[0])]});active.active={c:active.chapters.length-1,s:0};save();renderCourse()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#tokens').classList.toggle('hidden',b.dataset.t!=='tokens');$('#grammar').classList.toggle('hidden',b.dataset.t!=='grammar')});home();
</script></body></html>
